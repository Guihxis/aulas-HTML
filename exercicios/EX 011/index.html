<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em varios dispositivos ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(min-width: 1050px)" srcset="images/foto-g.png" type="image/png">
        <source media="(min-width: 750px)" srcset="images/foto-m.png" type="image/png">
        <img src="images/foto-p.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" autoplay controls loop>
      <source src="midia/intergalatic.mp3" type="audio/mpeg">

    </audio>
    <!-- MP3 WAV OGG -->
     <!--  <audio src="midia/" type=""></audio>   serve para adcionar audios em outros formatos -->
</body>
</html>
