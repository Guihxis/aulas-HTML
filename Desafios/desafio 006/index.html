<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>em HTML5, podemos inserir elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual a tag deverá ser utilizada em cada caso
    </p>
    <ul>
        <li><abbr title="Use a tag &lt;p&gt;">Parágafo</abbr></li>
        <li><abbr title="Use a tag &lt;h1&gt;">Títulos</abbr></li>
        <li><abbr title="Use a tag &lt;ol&gt;">Listas Numeradas</abbr></li>
        <li><abbr title="Use a tag &lt;ul&gt;">Listas com demarcadores</abbr></li>
        <li><abbr title="Use a tag &lt;abbr&gt;">Abrevisção</abbr></li>
        <li><abbr title="Use a tag &lt;img&gt;"></abbr>Imagens</li>
        <li><abbr title="Use a tag &lt;a&gt;">Links</abbr></li>

    </ul>
    
</body>
</html>
